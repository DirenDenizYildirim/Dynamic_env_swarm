# paper/v3/checks/caveats.yaml — the one-home map (V3-S5), machine-readable
#
# Owner: builder B1 (paper v3, step 3, 2026-10-14). B2's check reads this
# file; B1 owns its content. The human-readable map with sources is
# paper/v3/STRUCTURE.md §7. Reconciled from plans/P1.md §7, plans/P3.md §5.1
# and plans/P2.md §8; each entry's `from` says which.
#
# SEMANTICS (for B2's check)
# - Text is prepared as for terms.txt: HTML comments and fenced code bodies
#   stripped; captions, alt text and table cells kept.
# - An OCCURRENCE is one sentence (B2's sentence splitter; a table cell or a
#   caption counts as one sentence) that matches ANY of the entry's `regex`
#   patterns (Python `re`; case-sensitive unless the pattern starts `(?i)`).
#   Several matches in one sentence are one occurrence.
# - `home`: the file that holds the full statement. It must have at least 1
#   and at most `max_home` occurrences (default 1). If `home` is an appendix
#   file, the appendix file is scanned for this entry only.
# - `also`: main-text files allowed at most `max_also` occurrences each
#   (default 1): the short forms and the exceptions the rules require
#   (registered strings in the abstract, PR:118-124; the post hoc label,
#   PR:63-65; limitations in front, V3-F6).
# - Every other MAIN-TEXT file must have 0 occurrences. A pointer ("§6.3",
#   "see Appendix D") never matches, by design of the patterns.
# - `kind: label_required` entries are different: every main-text file with a
#   sentence matching `trigger` must also contain, in that same sentence or
#   in the same paragraph, a match of `label`.
# - Report, per entry: occurrences per file, and the sentence text of every
#   occurrence outside home/also (so the writer can see what to cut).
#
# Writers are told the detection phrase in their stub (STUB-SPEC CAVEATS),
# so the home sentence is written to be found. If a pattern proves too broad
# or too narrow on real text, B2 reports it to B1/the orchestrator; it is not
# loosened silently.

