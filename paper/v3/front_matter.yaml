# paper/v3/front_matter.yaml: copied from paper/v2/front_matter.yaml by the
# orchestrator (2026-10-14); read by paper/v3/src/build_v3.py. The build writes
# them into out/submission_v3.md,
# adds the generated `toc` and `_styles`, and never copies these comments.
#
# Placeholders are marked PLACEHOLDER. W1 drafts `title` and `description`;
# the owner chooses. `build_v3.py --final` fails while a placeholder remains.
#
# Rules (KIT_NOTES.md §S1.4; paper/v2/plans/P2.md §7.9). `title` and
# `description` are one line each, with no double quote and no backslash:
# the kit's distill.html puts both inside JavaScript string literals and a
# JSON block. A value containing ": " must be quoted; use single quotes, and
# double any single quote inside. The build re-quotes both in the kit source
# and checks the round trip.

layout: distill
title: 'A multi-agent fire environment with coupled stressors, and a pre-registered test of training on them together or apart'
description: 'A pure-JAX multi-agent environment in which collapse seeds fire, smoke attenuates perception and every stressor switches off exactly, with a pre-registered test as a worked example.'

# M3: PLACEHOLDER until the owner sets it (owner question Q2). The kit's
# "cite this work" box prints it in the BibTeX `year` field as a full date,
# `year = {October 11, 2026}`: the layout formats page.date that way, and
# authors cannot change it. Keep it no later than the upload day: Jekyll
# skips a future-dated page unless the site is built with --future (the
# kit's own preview uses --future; TMLR's build is unknown).
date: 2026-10-11
# The owner's confirmation of `date` (review RM-23). Leave it false until the
# owner sets the date: `build_v3.py --final` fails while it is not true; the
# default build only notes it. The build never copies this field into the kit
# source.
date_confirmed: false

# submitted_date: 2026-10-11
#   Present but unset on purpose (owner question Q2). Unset, Distill's byline
#   reads "Submitted: Not submitted yet." Set, it reads the date in Distill's
#   own format, for example "Oct. 11, 2026".

htmlwidgets: true
authors:
  - name: Anonymous
    affiliations:
      name: Anonymous
bibliography: submission.bib

# Never set during review: openreview_id (it adds a forum link).
# Generated by build_v3.py, never set here: toc, _styles.
