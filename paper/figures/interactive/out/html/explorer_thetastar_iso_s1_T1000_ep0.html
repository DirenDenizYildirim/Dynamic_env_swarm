<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode explorer</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--band:#ecebe5;--chipfill:#0b0b0b;--chiptext:#fcfcfb;--focus:#0b0b0b;--hover:rgba(11,11,11,0.06);--A:#4a3aa7;--B:#e87ba4;--fireonly:#c3c2b7;--fuel:#e9ebe0;--burning:#eb6834;--burnt:#3d3a36;--smoke_hatch:#f4f1eb;--map_gridline:#8c8a83;--agent:#2a78d6;--food:#1baf7a;--map_white:#ffffff;--map_bg:#fcfcfb;--map_ink:#0b0b0b;--outside:#f4f3ef;--unseen:#a9a59a;--unseen_mark:#3d3a36;--map_grid:#e1e0d9;--map_axis:#c3c2b7;--map_A:#4a3aa7;--tau_end:#9c2f5c;color-scheme:light;}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1a1a19;--ink:#f5f5f2;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--band:#2a2a27;--chipfill:#f5f5f2;--chiptext:#1a1a19;--focus:#f5f5f2;--hover:rgba(255,255,255,0.08);--A:#9085e9;--B:#d55181;--fireonly:#4a4945;--fuel:#e9ebe0;--burning:#eb6834;--burnt:#3d3a36;--smoke_hatch:#f4f1eb;--map_gridline:#8c8a83;--agent:#2a78d6;--food:#1baf7a;--map_white:#ffffff;--map_bg:#fcfcfb;--map_ink:#0b0b0b;--outside:#f4f3ef;--unseen:#a9a59a;--unseen_mark:#3d3a36;--map_grid:#e1e0d9;--map_axis:#c3c2b7;--map_A:#4a3aa7;--tau_end:#9c2f5c;color-scheme:dark;}}:root[data-theme="dark"]{--surface:#1a1a19;--ink:#f5f5f2;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--band:#2a2a27;--chipfill:#f5f5f2;--chiptext:#1a1a19;--focus:#f5f5f2;--hover:rgba(255,255,255,0.08);--A:#9085e9;--B:#d55181;--fireonly:#4a4945;--fuel:#e9ebe0;--burning:#eb6834;--burnt:#3d3a36;--smoke_hatch:#f4f1eb;--map_gridline:#8c8a83;--agent:#2a78d6;--food:#1baf7a;--map_white:#ffffff;--map_bg:#fcfcfb;--map_ink:#0b0b0b;--outside:#f4f3ef;--unseen:#a9a59a;--unseen_mark:#3d3a36;--map_grid:#e1e0d9;--map_axis:#c3c2b7;--map_A:#4a3aa7;--tau_end:#9c2f5c;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--surface);color:var(--ink);
 font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{padding:12px 16px 14px;max-width:980px;margin:0 auto}
.sub{color:var(--ink2);font-size:12px;margin:0 0 8px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 8px}
.ctl .lab{font-size:11px;color:var(--muted);margin-right:2px;text-transform:none}
button.pill{font:inherit;font-size:12px;min-height:28px;padding:3px 10px;border-radius:14px;
 border:1px solid var(--axis);background:var(--surface);color:var(--ink);cursor:pointer;
 display:inline-flex;align-items:center;gap:6px;line-height:1}
button.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button.pill:hover{background:var(--hover)}
button.pill[aria-pressed="true"]:hover{background:var(--ink)}
button.pill:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,summary:focus-visible{
 outline:2px solid var(--focus);outline-offset:2px}
input[type=range]{accent-color:var(--ink)}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 7px;
 border-radius:10px;border:1px solid var(--ink);white-space:nowrap;line-height:1.35}
.chip.fill{background:var(--chipfill);color:var(--chiptext)}
.chip.line{background:transparent;color:var(--ink)}
.chip.weak{color:var(--ink);background-image:radial-gradient(var(--muted) 0.8px,transparent 1px);
 background-size:4px 4px}
.tt{position:fixed;pointer-events:none;z-index:9;background:var(--surface);color:var(--ink);
 border:1px solid var(--axis);border-radius:6px;padding:6px 8px;font-size:12px;line-height:1.35;
 box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:280px;display:none}
.tt b{font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
details.tbl{margin-top:8px;font-size:12px}
details.tbl summary{cursor:pointer;color:var(--ink2)}
details.tbl table{border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl th,details.tbl td{border-bottom:1px solid var(--grid);padding:3px 8px;text-align:left;
 vertical-align:top}
svg text{fill:var(--ink);font-family:inherit}
svg .tick{fill:var(--muted);font-size:11px}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .ax{stroke:var(--axis);stroke-width:1}
svg .zero{stroke:var(--muted);stroke-width:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{.ctl,.noprint,details.tbl{display:none!important} .tt{display:none!important}}

.hdr{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:6px}
.hdr .pol{font-weight:600;font-size:14px}
.scrub{margin:2px 0 10px}
.scrub input{width:100%;margin:0}
#track{display:block;width:100%;height:22px;cursor:pointer}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:700px){.main{grid-template-columns:1fr}}
.mapbox{position:relative}
#map{display:block;width:100%;aspect-ratio:1/1;border-radius:6px;cursor:crosshair}
.side .lab{font-size:11px;color:var(--muted);margin:6px 0 4px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;flex:none}
.obsrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.obsrow figure{margin:0}
.obsrow canvas{display:block;width:100%;aspect-ratio:1/1;border-radius:4px}
.obsrow figcaption{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.25}
.agents button.pill{min-width:30px;justify-content:center;padding:3px 6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sel{font-size:12px;margin-top:6px;min-height:1.4em}
.kbd{font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="hdr"><span class="pol" id="pol"></span><span class="sub" id="sub"></span></div>
  <div class="ctl" role="group" aria-label="playback">
    <button class="pill" id="play" aria-pressed="false">&#9654; play</button>
    <button class="pill" id="back" aria-label="previous step">&#9664;</button>
    <button class="pill" id="fwd" aria-label="next step">&#9654;&#xFE0E;</button>
    <span class="lab">speed</span>
    <span class="row" id="speeds"></span>
    <span class="num" id="tlab" aria-live="polite"></span>
  </div>
  <div class="scrub">
    <input type="range" id="scrub" min="0" max="256" step="1" value="0" aria-label="time step t">
    <svg id="track" role="img" aria-label="time track: collapse events and collapse-seeded ignitions"></svg>
    <div class="ctl" style="margin:2px 0 0">
      <button class="pill" id="evprev">&#9664; event</button>
      <button class="pill" id="evnext">event &#9654;</button>
      <span class="legend" style="margin:0">
        <span><svg width="10" height="10"><rect x="1" y="1" width="8" height="8" fill="var(--ink)"/></svg>collapse event</span>
        <span><svg width="12" height="12"><circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--A)" stroke-width="2"/></svg>collapse-seeded ignition (Coupling A)</span>
      </span>
    </div>
  </div>
  <div class="main">
    <div class="mapbox"><canvas id="map" role="img" tabindex="0"></canvas></div>
    <div class="side">
      <div class="lab">layers</div>
      <div class="row" id="layers"></div>
      <div class="lab">agent: click a marker on the map, or a number</div>
      <div class="row agents" id="agents"></div>
      <div class="sel" id="sel"></div>
      <div class="obsrow">
        <figure><canvas id="obs"></canvas><figcaption>observation, as produced (obs v3)</figcaption></figure>
        <figure><canvas id="tru"></canvas><figcaption>state, same 9 × 9 cells</figcaption></figure>
        <figure><canvas id="tau"></canvas><figcaption>P(seen) = τ, Beer–Lambert transmittance</figcaption></figure>
      </div>
      <div class="legend" id="olegend"></div>
      <div class="kbd noprint">keys: space play/pause · ← → step (shift: 10) · [ ] previous / next event · 1–9 agent</div>
    </div>
  </div>
</div>

<script>
(function(){
  // Theme: follow the embedding page when same-origin (al-folio sets data-theme).
  function syncTheme(){
    try{
      var p = window.parent && window.parent !== window && window.parent.document;
      var t = p && p.documentElement.getAttribute('data-theme');
      if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);return;}
    }catch(e){}
  }
  syncTheme();
  try{
    var pd = window.parent && window.parent !== window && window.parent.document;
    if(pd && window.MutationObserver){
      new MutationObserver(function(){syncTheme(); if(window.__redraw) window.__redraw();})
        .observe(pd.documentElement,{attributes:true,attributeFilter:['data-theme']});
    }
  }catch(e){}
  // Self-size the iframe when same-origin (fixed iframe heights clip on phones).
  function fit(){
    try{
      var fe = window.frameElement;
      if(fe){ fe.style.height = (document.documentElement.scrollHeight + 4) + 'px'; }
    }catch(e){}
  }
  window.__fit = fit;
  window.addEventListener('load', fit);
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.body); }
  window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)')
    .addEventListener && window.matchMedia('(prefers-color-scheme: dark)')
    .addEventListener('change', function(){ if(window.__redraw) window.__redraw(); });
})();
var U = {
  css: function(name){ return getComputedStyle(document.documentElement).getPropertyValue('--'+name).trim(); },
  reduced: function(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); },
  el: function(tag, attrs, text){
    var e = document.createElement(tag);
    if(attrs) for(var k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k, attrs[k]); }
    if(text!==undefined && text!==null) e.textContent = text;
    return e;
  },
  svg: function(tag, attrs, text){
    var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if(attrs) for(var k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k, attrs[k]); }
    if(text!==undefined && text!==null) e.textContent = text;
    return e;
  },
  clear: function(n){ while(n.firstChild) n.removeChild(n.firstChild); },
  sgn: function(x, d){ var s = (x>0?'+':(x<0?'−':'')); return s + Math.abs(x).toFixed(d); },
  ci: function(a, d){ return '[' + U.sgn(a[0],d) + ', ' + U.sgn(a[1],d) + ']'; },
  tip: (function(){
    var t = null;
    function node(){ if(!t){ t = document.createElement('div'); t.className='tt'; t.setAttribute('role','tooltip'); document.body.appendChild(t);} return t; }
    return {
      show: function(lines, x, y){
        var n = node(); U.clear(n);
        lines.forEach(function(l, i){
          var d = document.createElement('div');
          if(Array.isArray(l)){ var b=document.createElement('b'); b.textContent=l[0]; d.appendChild(b);
            if(l[1]) d.appendChild(document.createTextNode(' ' + l[1])); }
          else d.textContent = l;
          n.appendChild(d);
        });
        n.style.display='block';
        var w = n.offsetWidth, h = n.offsetHeight;
        var vx = Math.min(x + 14, window.innerWidth - w - 6), vy = y + 14;
        if(vy + h > window.innerHeight - 4) vy = Math.max(4, y - h - 10);
        n.style.left = Math.max(4, vx) + 'px'; n.style.top = vy + 'px';
      },
      hide: function(){ if(t) t.style.display='none'; }
    };
  })(),
  b64: function(s){ var bin = atob(s), n = bin.length, out = new Uint8Array(n);
    for(var i=0;i<n;i++) out[i] = bin.charCodeAt(i); return out; },
  // Tooltip at a focused element's position (keyboard parity with hover).
  tipAt: function(el, lines){ var r = el.getBoundingClientRect(); U.tip.show(lines, r.left + r.width/2, r.top + r.height/2); }
};

// ---------- colours (map imagery = the restyled GIFs' palette, both themes) ----------
var COL = {};
function hexRgb(h){ h = h.replace('#',''); return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
function mix(a, b, u){ var x = hexRgb(a), y = hexRgb(b); return 'rgb(' + [0,1,2].map(function(i){ return Math.round(x[i]*(1-u) + y[i]*u); }).join(',') + ')'; }
function readColors(){
  ['fuel','burning','burnt','smoke_hatch','map_gridline','agent','food','map_white','map_bg','map_ink','outside','unseen','unseen_mark','map_grid','map_axis','map_A','tau_end']
    .forEach(function(k){ COL[k] = U.css(k); });
  COL.state = [COL.fuel, COL.burning, COL.burnt];
  COL.gridl = COL.state.map(function(c){ return mix(c, COL.map_gridline, 0.16); });
  COL.weakdot = [mix(COL.fuel, COL.map_ink, 0.5), mix(COL.burning, COL.map_ink, 0.5), mix(COL.burnt, COL.map_white, 0.5)];
  COL.void = [COL.map_ink, COL.map_ink, COL.map_white];
  COL.tau = function(tau){ return mix(COL.map_bg, COL.tau_end, 1 - tau); };
}

// ---------- cell painter (shared by map and the 9x9 panels) ----------
// Matches the restyled GIFs: flat hazard fill, faint cell
// gridline, smoke rho as light diagonal hatching (opacity proportional to rho,
// 16 steps), weak intact floor as a centre dot, collapsed floor as a boxed X
// keeping the hazard fill, food as an aqua square with a dark ring.
// cell: {h, rho(0..1), weak, coll, food}
function paintCell(ctx, x, y, s, c, opt){
  var h = opt.fire ? c.h : 0;
  ctx.fillStyle = opt.fire ? COL.state[h] : COL.map_bg; ctx.fillRect(x, y, s, s);
  if(s >= 5){ ctx.fillStyle = opt.fire ? COL.gridl[h] : COL.map_grid; ctx.fillRect(x + s - Math.max(1, s/8), y, Math.max(1, s/8), s); ctx.fillRect(x, y + s - Math.max(1, s/8), s, Math.max(1, s/8)); }
  if(opt.smoke && c.rho > 0){
    var lv = Math.round(c.rho * 15) / 15;
    if(lv > 0){ ctx.save(); ctx.beginPath(); ctx.rect(x, y, s - Math.max(1, s/8), s - Math.max(1, s/8)); ctx.clip();
      ctx.globalAlpha = lv * 0.9; ctx.strokeStyle = COL.smoke_hatch; ctx.lineWidth = Math.max(1, s/8);
      var stp = s/2; for(var k = -s; k <= 2*s; k += stp){ ctx.beginPath(); ctx.moveTo(x + k, y); ctx.lineTo(x + k - s, y + s); ctx.stroke(); }
      ctx.restore(); ctx.globalAlpha = 1; }
  }
  if(opt.weak && c.weak && !c.coll){ var w = Math.max(1, s/4); ctx.fillStyle = COL.weakdot[h]; ctx.fillRect(x + s*3/8, y + s*3/8, w, w); }
  if(opt.coll && c.coll){
    var q = s*7/8, lw = Math.max(1, s/8); ctx.strokeStyle = COL.void[h]; ctx.lineWidth = lw;
    ctx.strokeRect(x + lw/2, y + lw/2, q - lw, q - lw);
    ctx.beginPath(); ctx.moveTo(x + lw/2, y + lw/2); ctx.lineTo(x + q - lw/2, y + q - lw/2); ctx.moveTo(x + q - lw/2, y + lw/2); ctx.lineTo(x + lw/2, y + q - lw/2); ctx.stroke();
  }
  if(opt.food && c.food){ var e = s/8; ctx.fillStyle = COL.map_ink; ctx.fillRect(x, y, s*7/8, s*7/8); ctx.fillStyle = COL.food; ctx.fillRect(x + e, y + e, s*5/8, s*5/8); }
}
// agent sprites as in the GIFs: alive = blue disc in white and dark rings;
// dead = a hollow dark ring with white either side (radii in cells: .82/.70/.56; .82/.70/.45/.325)
function ring(ctx, cx, cy, r0, r1, col){ ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r1, 0, 6.2832); ctx.arc(cx, cy, r0, 0, 6.2832, true); ctx.fill(); }
function drawAgentMark(ctx, cx, cy, s, alive, selected){
  if(alive){
    ctx.fillStyle = COL.map_ink; ctx.beginPath(); ctx.arc(cx, cy, 0.82*s, 0, 6.2832); ctx.fill();
    ctx.fillStyle = COL.map_white; ctx.beginPath(); ctx.arc(cx, cy, 0.70*s, 0, 6.2832); ctx.fill();
    ctx.fillStyle = COL.agent; ctx.beginPath(); ctx.arc(cx, cy, 0.56*s, 0, 6.2832); ctx.fill();
  } else {
    ring(ctx, cx, cy, 0.70*s, 0.82*s, COL.map_white); ring(ctx, cx, cy, 0.45*s, 0.70*s, COL.map_ink); ring(ctx, cx, cy, 0.325*s, 0.45*s, COL.map_white);
  }
  if(selected){ ctx.strokeStyle = COL.map_white; ctx.lineWidth = Math.max(3, s*0.4); ctx.beginPath(); ctx.arc(cx, cy, 1.25*s, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = COL.map_ink; ctx.lineWidth = Math.max(1.5, s*0.2); ctx.stroke(); }
}
function cellAt(t, i){
  return {h: HZ[t*NN+i], rho: SM[t*NN+i]/255, weak: WEAK[i], coll: COLL[t*NN+i], food: FOOD[t*NN+i]};
}

var map = document.getElementById('map'), mctx = map.getContext('2d'), MS = 8, DPR = 1;

      var cx=(c%L+0.5)*s, cy=(((c/L)|0)+0.5)*s; mctx.strokeStyle = COL.map_white; mctx.lineWidth = Math.max(2.5, s*0.32);
      mctx.beginPath(); mctx.arc(cx, cy, s*0.42, 0, 6.2832); mctx.stroke(); mctx.strokeStyle = COL.map_A; mctx.lineWidth = Math.max(1.2, s*0.16); mctx.stroke(); } }
    SEEDL[t].forEach(function(c){ var cx=(c%L+0.5)*s, cy=(((c/L)|0)+0.5)*s;
      mctx.strokeStyle = COL.map_white; mctx.lineWidth = Math.max(4, s*0.6); mctx.beginPath(); mctx.arc(cx, cy, s*1.35, 0, 6.2832); mctx.stroke();

function drawPanels(){
  [pobs, ptru, ptau].forEach(function(cv){ PS = sizePanel(cv); });
  var octx = pobs.getContext('2d'), tctx = ptru.getContext('2d'), uctx = ptau.getContext('2d'), s = PS;
  var sel = document.getElementById('sel');
  [octx, tctx, uctx].forEach(function(c){ c.fillStyle = COL.map_bg; c.fillRect(0,0,K*s,K*s); });
  if(S.agent < 0){ sel.textContent = 'no agent selected'; return; }
  var t = S.t, a = S.agent, p = agentPos(t, a), base = (t*NA + a)*KK;
  sel.textContent = 'agent ' + (a+1) + (isAlive(t,a) ? '' : ', dead') + ' · t = ' + t;
  var occ = {}, dead = {}; for(var b=0;b<NA;b++){ var q = agentPos(t,b); if(isAlive(t,b)) occ[q[0]*L+q[1]] = 1; else dead[q[0]*L+q[1]] = 1; }
  var full = {fire:true, smoke:true, weak:true, coll:true, food:true};
  for(var dr=0; dr<K; dr++) for(var dc=0; dc<K; dc++){

      else if(dead[gr*L+gc]) drawAgentMark(tctx, x+s/2, y+s/2, s*0.55, false, false); }
    else { tctx.fillStyle = COL.outside; tctx.fillRect(x, y, s, s); }
    // observation panel: content planes x reveal; out-of-arena cells are zero planes

    else { paintCell(octx, x, y, s, {h:0, rho:0, weak:0, coll:0, food:0}, full); }

}

// ---------- playback ----------
var playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), tlab = document.getElementById('tlab');
scrub.max = T-1;
var SPEEDS = [0.5, 1, 2, 4], BASE = 16, last = null, acc = 0;
var speedBox = document.getElementById('speeds');
SPEEDS.forEach(function(v){ var b = U.el('button', {'class':'pill', 'aria-pressed': v===S.speed?'true':'false'}, v + '×');
  b.addEventListener('click', function(){ S.speed = v; Array.prototype.forEach.call(speedBox.children, function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); }); });
  speedBox.appendChild(b); });
function setPlaying(p){ S.playing = p; playBtn.setAttribute('aria-pressed', p?'true':'false'); playBtn.innerHTML = p ? '&#10074;&#10074; pause' : '&#9654; play'; last = null; acc = 0; if(p) requestAnimationFrame(loop); }
function loop(ts){
  if(!S.playing) return;
  if(last === null) last = ts; var dt = ts - last; last = ts; acc += dt * BASE * S.speed / 1000;
  var adv = Math.floor(acc); if(adv > 0){ acc -= adv; var t = S.t + adv; if(t >= T-1){ t = T-1; S.t = t; render(); setPlaying(false); return; } S.t = t; render(); }
  requestAnimationFrame(loop);
}
function seek(t){ S.t = Math.max(0, Math.min(T-1, t)); render(); writeHash(); }
playBtn.addEventListener('click', function(){ if(!S.playing && S.t >= T-1) S.t = 0; setPlaying(!S.playing); });
document.getElementById('back').addEventListener('click', function(){ setPlaying(false); seek(S.t-1); });
document.getElementById('fwd').addEventListener('click', function(){ setPlaying(false); seek(S.t+1); });
scrub.addEventListener('input', function(){ setPlaying(false); seek(parseInt(scrub.value,10)); });
function jumpEvent(dir){ setPlaying(false); var cand = EVENTS.filter(function(f){ return dir>0 ? f > S.t : f < S.t; }); if(cand.length) seek(dir>0 ? cand[0] : cand[cand.length-1]); }
document.getElementById('evprev').addEventListener('click', function(){ jumpEvent(-1); });
document.getElementById('evnext').addEventListener('click', function(){ jumpEvent(1); });
document.addEventListener('keydown', function(e){
  var tag = (e.target && e.target.tagName) || '';
  if(e.key === ' ' && tag !== 'BUTTON' && tag !== 'INPUT'){ e.preventDefault(); if(!S.playing && S.t >= T-1) S.t = 0; setPlaying(!S.playing); return; }
  if(tag === 'INPUT') return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); setPlaying(false); seek(S.t + (e.shiftKey?10:1)); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); setPlaying(false); seek(S.t - (e.shiftKey?10:1)); }
  else if(e.key === 'Home'){ e.preventDefault(); seek(0); }
  else if(e.key === 'End'){ e.preventDefault(); seek(T-1); }
  else if(e.key === ']'){ jumpEvent(1); } else if(e.key === '['){ jumpEvent(-1); }
  else if(/^[1-9]$/.test(e.key)){ var a = parseInt(e.key,10)-1; if(a < NA){ S.agent = a; render(); writeHash(); } }
});

function cellFromEvent(e){ var r = map.getBoundingClientRect(); var c = Math.floor((e.clientX - r.left)/r.width*L), rr = Math.floor((e.clientY - r.top)/r.height*L); return [rr, c]; }

  if(c.food) lines.push('food');
  if(SEEDT[i] >= 0 && SEEDT[i] <= S.t) lines.push('collapse-seeded ignition at t = ' + SEEDT[i]);
  for(var a=0;a<NA;a++){ var p = agentPos(S.t,a); if(p[0]===rc[0] && p[1]===rc[1]) lines.push('agent ' + (a+1) + (isAlive(S.t,a)?'':', dead')); }

map.addEventListener('click', function(e){
  var rc = cellFromEvent(e), best = -1, bd = 2.3;
  for(var a=0;a<NA;a++){ var p = agentPos(S.t,a), d = Math.hypot(p[0]-rc[0], p[1]-rc[1]); if(d < bd){ bd = d; best = a; } }
  if(best >= 0){ S.agent = best; render(); writeHash(); }
});
function panelHover(cv, which){
  cv.addEventListener('mousemove', function(e){
    if(S.agent < 0) return; var r = cv.getBoundingClientRect(); var dc = Math.floor((e.clientX-r.left)/r.width*K), dr = Math.floor((e.clientY-r.top)/r.height*K);
    if(dr<0||dr>=K||dc<0||dc>=K){ U.tip.hide(); return; }
    var p = agentPos(S.t, S.agent), j = (S.t*NA+S.agent)*KK + dr*K+dc, gr = p[0]-R+dr, gc = p[1]-R+dc;
    var inside = gr>=0&&gr<L&&gc>=0&&gc<L, seen = REV[j]===1, tau = 1-TAUQ[j]/255;
    var lines = [['offset', '(' + (dr-R) + ', ' + (dc-R) + ')' + (inside ? ' · cell (' + gr + ', ' + gc + ')' : ' · outside the arena')]];
    lines.push('P(seen) = τ ≈ ' + tau.toFixed(2) + ' · ' + (seen ? 'seen' : 'unseen (masked)'));
    if(inside){ var c = cellAt(S.t, gr*L+gc); lines.push('state: ' + HSTATE[c.h] + (c.rho>0 ? ', ρ ≈ ' + c.rho.toFixed(2) : '')); }
    U.tip.show(lines, e.clientX, e.clientY);
  });
  cv.addEventListener('mouseleave', function(){ U.tip.hide(); });
}
[pobs, ptru, ptau].forEach(panelHover);

// ---------- render ----------
function render(){
  scrub.value = S.t; tlab.textContent = 't = ' + S.t + ' / ' + M.H;
  drawMap(); drawPanels(); drawTrack();
  Array.prototype.forEach.call(agentBox.children, function(b, i){ b.setAttribute('aria-pressed', i===S.agent?'true':'false'); });
}
function full(){ readColors(); sizeMap(); buildLayers(); obsLegend(); render(); if(window.__fit) window.__fit(); }
window.__redraw = full;
var rt = null; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(full, 80); });
window.addEventListener('beforeprint', full);
full();
</script>
