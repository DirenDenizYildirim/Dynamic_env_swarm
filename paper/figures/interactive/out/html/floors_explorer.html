<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floors explorer</title>
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--band:#ecebe5;--chipfill:#0b0b0b;--chiptext:#fcfcfb;--focus:#0b0b0b;--hover:rgba(11,11,11,0.06);--A:#4a3aa7;--B:#e87ba4;--fireonly:#c3c2b7;--fuel:#e9ebe0;--burning:#eb6834;--burnt:#3d3a36;--smoke_hatch:#f4f1eb;--map_gridline:#8c8a83;--agent:#2a78d6;--food:#1baf7a;--map_white:#ffffff;--map_bg:#fcfcfb;--map_ink:#0b0b0b;--outside:#f4f3ef;--unseen:#a9a59a;--unseen_mark:#3d3a36;--map_grid:#e1e0d9;--map_axis:#c3c2b7;--map_A:#4a3aa7;--tau_end:#9c2f5c;color-scheme:light;}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1a1a19;--ink:#f5f5f2;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--band:#2a2a27;--chipfill:#f5f5f2;--chiptext:#1a1a19;--focus:#f5f5f2;--hover:rgba(255,255,255,0.08);--A:#9085e9;--B:#d55181;--fireonly:#4a4945;--fuel:#e9ebe0;--burning:#eb6834;--burnt:#3d3a36;--smoke_hatch:#f4f1eb;--map_gridline:#8c8a83;--agent:#2a78d6;--food:#1baf7a;--map_white:#ffffff;--map_bg:#fcfcfb;--map_ink:#0b0b0b;--outside:#f4f3ef;--unseen:#a9a59a;--unseen_mark:#3d3a36;--map_grid:#e1e0d9;--map_axis:#c3c2b7;--map_A:#4a3aa7;--tau_end:#9c2f5c;color-scheme:dark;}}:root[data-theme="dark"]{--surface:#1a1a19;--ink:#f5f5f2;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--band:#2a2a27;--chipfill:#f5f5f2;--chiptext:#1a1a19;--focus:#f5f5f2;--hover:rgba(255,255,255,0.08);--A:#9085e9;--B:#d55181;--fireonly:#4a4945;--fuel:#e9ebe0;--burning:#eb6834;--burnt:#3d3a36;--smoke_hatch:#f4f1eb;--map_gridline:#8c8a83;--agent:#2a78d6;--food:#1baf7a;--map_white:#ffffff;--map_bg:#fcfcfb;--map_ink:#0b0b0b;--outside:#f4f3ef;--unseen:#a9a59a;--unseen_mark:#3d3a36;--map_grid:#e1e0d9;--map_axis:#c3c2b7;--map_A:#4a3aa7;--tau_end:#9c2f5c;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--surface);color:var(--ink);
 font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{padding:12px 16px 14px;max-width:980px;margin:0 auto}
.sub{color:var(--ink2);font-size:12px;margin:0 0 8px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 8px}
.ctl .lab{font-size:11px;color:var(--muted);margin-right:2px;text-transform:none}
button.pill{font:inherit;font-size:12px;min-height:28px;padding:3px 10px;border-radius:14px;
 border:1px solid var(--axis);background:var(--surface);color:var(--ink);cursor:pointer;
 display:inline-flex;align-items:center;gap:6px;line-height:1}
button.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button.pill:hover{background:var(--hover)}
button.pill[aria-pressed="true"]:hover{background:var(--ink)}
button.pill:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,summary:focus-visible{
 outline:2px solid var(--focus);outline-offset:2px}
input[type=range]{accent-color:var(--ink)}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 7px;
 border-radius:10px;border:1px solid var(--ink);white-space:nowrap;line-height:1.35}
.chip.fill{background:var(--chipfill);color:var(--chiptext)}
.chip.line{background:transparent;color:var(--ink)}
.chip.weak{color:var(--ink);background-image:radial-gradient(var(--muted) 0.8px,transparent 1px);
 background-size:4px 4px}
.tt{position:fixed;pointer-events:none;z-index:9;background:var(--surface);color:var(--ink);
 border:1px solid var(--axis);border-radius:6px;padding:6px 8px;font-size:12px;line-height:1.35;
 box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:280px;display:none}
.tt b{font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
details.tbl{margin-top:8px;font-size:12px}
details.tbl summary{cursor:pointer;color:var(--ink2)}
details.tbl table{border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl th,details.tbl td{border-bottom:1px solid var(--grid);padding:3px 8px;text-align:left;
 vertical-align:top}
svg text{fill:var(--ink);font-family:inherit}
svg .tick{fill:var(--muted);font-size:11px}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .ax{stroke:var(--axis);stroke-width:1}
svg .zero{stroke:var(--muted);stroke-width:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{.ctl,.noprint,details.tbl{display:none!important} .tt{display:none!important}}

#panel svg{display:block;width:100%;height:auto;max-width:760px}
.conf{font-size:12px;color:var(--ink);border-left:3px solid var(--ink);padding:2px 8px;margin:8px 0 0}
</style>
</head>
<body>

<div class="wrap">
  <div class="ctl" role="tablist" aria-label="floor exhibits" id="tabs"></div>
  <p class="sub" id="sub"></p>
  <div id="panel"></div>
  <p class="conf" id="conf"></p>
</div>

<script type="application/json" id="data">{"card":{"runs":[{"name":"M5.1e · RTX 5090","completion":0.0145,"survival":0.0129,"ct":"0.0145","st":"0.0129"},{"name":"M5.5 · RTX PRO 6000","completion":0.0399,"survival":0.013,"ct":"0.0399","st":"0.0130"}],"ratio":"2.75×","confound":"card, code tree and config all differ between the two runs (M5.5 records R_comm 16; M5.1e predates the R_comm lock)","sub":"Medium, identical runs per floor, same seed: nondeterminism only"},"artifact":{"rows":[{"name":"baseline vs baseline","n":4,"diff":0,"text":"0 of 760 field digests differ, in 4 of 4"},{"name":"traced vs traced","n":4,"diff":1,"text":"1 of 4: masked_frac, masked_danger_sum"},{"name":"traced vs baseline","n":5,"diff":2,"text":null}],"sub":"M6.0 GPU rerun comparisons, severity_high seed 0; no trajectory field differed in any comparison"},"length":{"arms":[{"name":"ISO","v500":[0.744140625,0.69329833984375,0.7347412109375,0.71978759765625,0.74432373046875,0.7353515625,0.7294921875,0.72674560546875],"v1000":[0.83599853515625,0.75225830078125,0.7520751953125,0.74951171875,0.7291259765625,0.73797607421875,0.743408203125,0.73681640625],"g":"2.1×"},{"name":"JOINT","v500":[0.685302734375,0.70379638671875,0.718994140625,0.7008056640625,0.7052001953125,0.697998046875,0.70416259765625,0.7042236328125],"v1000":[0.82635498046875,0.7117919921875,0.77215576171875,0.68975830078125,0.69305419921875,0.77215576171875,0.77215576171875,0.72003173828125],"g":"5.2×"}],"confound":"run length and box both differ: the T = 500 and T = 1000 floors ran on different RTX PRO 6000 boxes","sub":"completion floor, identical runs per arm and length, same seed"},"beat":{"rows":[{"name":"completion · ISO","v":1.115533484999004,"t":"1.12×"},{"name":"completion · JOINT","v":1.0868650912824094,"t":"1.09×"},{"name":"survival · ISO","v":1.2503451100857148,"t":"1.25×"},{"name":"survival · JOINT","v":1.1910537351691932,"t":"1.19×"}],"gamma":{"v":5.3989565403236845,"t":"5.40×"},"sub":"the confirmatory grid (k = 72 per arm): seed sd over the rerun floor; survival Γ over the floor-basis sd(Γ)"}}</script>
<script>
(function(){
  // Theme: follow the embedding page when same-origin (al-folio sets data-theme).
  function syncTheme(){
    try{
      var p = window.parent && window.parent !== window && window.parent.document;
      var t = p && p.documentElement.getAttribute('data-theme');
      if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);return;}
    }catch(e){}
  }
  syncTheme();
  try{
    var pd = window.parent && window.parent !== window && window.parent.document;
    if(pd && window.MutationObserver){
      new MutationObserver(function(){syncTheme(); if(window.__redraw) window.__redraw();})
        .observe(pd.documentElement,{attributes:true,attributeFilter:['data-theme']});
    }
  }catch(e){}
  // Self-size the iframe when same-origin (fixed iframe heights clip on phones).
  function fit(){
    try{
      var fe = window.frameElement;
      if(fe){ fe.style.height = (document.documentElement.scrollHeight + 4) + 'px'; }
    }catch(e){}
  }
  window.__fit = fit;
  window.addEventListener('load', fit);
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.body); }
  window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)')
    .addEventListener && window.matchMedia('(prefers-color-scheme: dark)')
    .addEventListener('change', function(){ if(window.__redraw) window.__redraw(); });
})();
var U = {
  css: function(name){ return getComputedStyle(document.documentElement).getPropertyValue('--'+name).trim(); },
  reduced: function(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); },
  el: function(tag, attrs, text){
    var e = document.createElement(tag);
    if(attrs) for(var k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k, attrs[k]); }
    if(text!==undefined && text!==null) e.textContent = text;
    return e;
  },
  svg: function(tag, attrs, text){
    var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if(attrs) for(var k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k, attrs[k]); }
    if(text!==undefined && text!==null) e.textContent = text;
    return e;
  },
  clear: function(n){ while(n.firstChild) n.removeChild(n.firstChild); },
  sgn: function(x, d){ var s = (x>0?'+':(x<0?'−':'')); return s + Math.abs(x).toFixed(d); },
  ci: function(a, d){ return '[' + U.sgn(a[0],d) + ', ' + U.sgn(a[1],d) + ']'; },
  tip: (function(){
    var t = null;
    function node(){ if(!t){ t = document.createElement('div'); t.className='tt'; t.setAttribute('role','tooltip'); document.body.appendChild(t);} return t; }
    return {
      show: function(lines, x, y){
        var n = node(); U.clear(n);
        lines.forEach(function(l, i){
          var d = document.createElement('div');
          if(Array.isArray(l)){ var b=document.createElement('b'); b.textContent=l[0]; d.appendChild(b);
            if(l[1]) d.appendChild(document.createTextNode(' ' + l[1])); }
          else d.textContent = l;
          n.appendChild(d);
        });
        n.style.display='block';
        var w = n.offsetWidth, h = n.offsetHeight;
        var vx = Math.min(x + 14, window.innerWidth - w - 6), vy = y + 14;
        if(vy + h > window.innerHeight - 4) vy = Math.max(4, y - h - 10);
        n.style.left = Math.max(4, vx) + 'px'; n.style.top = vy + 'px';
      },
      hide: function(){ if(t) t.style.display='none'; }
    };
  })(),
  b64: function(s){ var bin = atob(s), n = bin.length, out = new Uint8Array(n);
    for(var i=0;i<n;i++) out[i] = bin.charCodeAt(i); return out; },
  // Tooltip at a focused element's position (keyboard parity with hover).
  tipAt: function(el, lines){ var r = el.getBoundingClientRect(); U.tip.show(lines, r.left + r.width/2, r.top + r.height/2); }
};
</script>
<script>
var D = JSON.parse(document.getElementById('data').textContent);
var TABS = [{k:'card', t:'per card (and tree, and config)'}, {k:'artifact', t:'per artifact'}, {k:'length', t:'per run length'}, {k:'beat', t:'the grid against its floor'}];
var S = {tab: 'card'};
(function(){ var h=(location.hash||'').replace('#',''); TABS.forEach(function(x){ if(h==='tab='+x.k) S.tab=x.k; }); })();
var tabs = document.getElementById('tabs');
TABS.forEach(function(x){ var b = U.el('button', {'class':'pill', role:'tab', 'aria-selected':'false', 'aria-pressed':'false'}, x.t);
  b.onclick = function(){ S.tab = x.k; render(); }; tabs.appendChild(b); });
function txt(svg, x, y, s, o){ var a = {x:x, y:y, 'font-size':11.5}; for(var k in (o||{})) a[k]=o[k]; svg.appendChild(U.svg('text', a, s)); }
function hover(g, lines){ g.setAttribute('tabindex', 0);
  g.addEventListener('mousemove', function(e){ U.tip.show(lines, e.clientX, e.clientY); }); g.addEventListener('mouseleave', function(){ U.tip.hide(); });
  g.addEventListener('focus', function(){ U.tipAt(g, lines); }); g.addEventListener('blur', function(){ U.tip.hide(); }); }
function card(){
  var d = D.card, W = 620, H = 220, svg = U.svg('svg', {viewBox:'0 0 '+W+' '+H, role:'img', 'aria-label':'Medium reproducibility floors on two runs'});
  var x0 = 170, x1 = 560, X = function(v){ return x0 + v/0.045*(x1-x0); };
  [0,0.01,0.02,0.03,0.04].forEach(function(v){ svg.appendChild(U.svg('line', {x1:X(v), x2:X(v), y1:18, y2:H-34, 'class':'gl'})); txt(svg, X(v), H-18, v.toFixed(2), {'text-anchor':'middle', 'class':'tick'}); });
  txt(svg, (x0+x1)/2, H-2, 'rerun floor: sd over identical runs', {'text-anchor':'middle', style:'fill:var(--ink2)', 'font-size':11});
  [['completion','completion','ct'],['survival','survival rate','st']].forEach(function(m, i){
    var y = 30 + i*86; txt(svg, 6, y+4, m[1], {'font-weight':600});
    d.runs.forEach(function(r, j){ var yy = y + 16 + j*26, v = r[m[0]], g = U.svg('g');
      g.appendChild(U.svg('text', {x:6, y:yy+5, 'font-size':11, style:'fill:var(--ink2)'}, r.name));
      g.appendChild(U.svg('rect', {x:x0, y:yy-7, width:X(v)-x0, height:14, rx:3, fill: j ? 'var(--ink)' : 'var(--muted)'}));
      g.appendChild(U.svg('text', {x:X(v)+6, y:yy+5, 'font-size':11.5, 'font-weight':600, 'class':'num'}, r[m[2]]));
      hover(g, [[r.name, '· ' + m[1]], ['floor (sd)', r[m[2]]], 'identical runs, same seed']); svg.appendChild(g); });
    if(i===0) txt(svg, X(0.0399)+52, y+33, d.ratio, {'font-size':11, style:'fill:var(--ink2)'});
  });
  return svg;
}
function artifact(){
  var d = D.artifact, W = 620, H = 170, svg = U.svg('svg', {viewBox:'0 0 '+W+' '+H, role:'img', 'aria-label':'per-artifact rerun comparisons'});
  txt(svg, 190, 16, 'each square: one rerun comparison · filled: field digests differed', {'font-size':10.5, style:'fill:var(--muted)'});
  d.rows.forEach(function(r, i){ var y = 44 + i*42, g = U.svg('g');
    g.appendChild(U.svg('text', {x:6, y:y+5, 'font-size':12, 'font-weight':600}, r.name));
    for(var k=0;k<r.n;k++){ g.appendChild(U.svg('rect', {x:190+k*26, y:y-10, width:20, height:20, rx:3, fill: k < r.diff ? 'var(--ink)' : 'var(--surface)', stroke:'var(--ink)', 'stroke-width':1.3})); }
    if(r.text) g.appendChild(U.svg('text', {x:190+5*26+12, y:y+5, 'font-size':11, style:'fill:var(--ink2)'}, r.text));
    hover(g, r.text ? [[r.name, ''], r.text] : [[r.name, '']]); svg.appendChild(g); });
  return svg;
}
function length(){
  var d = D.length, W = 620, H = 250, svg = U.svg('svg', {viewBox:'0 0 '+W+' '+H, role:'img', 'aria-label':'completion floor reps at two run lengths'});
  var all = []; d.arms.forEach(function(a){ all = all.concat(a.v500, a.v1000); });
  var lo = Math.min.apply(null, all) - 0.01, hi = Math.max.apply(null, all) + 0.01, y0 = 20, y1 = H-40;
  var Y = function(v){ return y1 - (v-lo)/(hi-lo)*(y1-y0); };
  txt(svg, 6, y0+6, 'completion,', {'font-size':10.5, style:'fill:var(--muted)'}); txt(svg, 6, y0+19, 'one dot per run', {'font-size':10.5, style:'fill:var(--muted)'});
  for(var v = Math.ceil(lo*50)/50; v <= hi; v += 0.02){ svg.appendChild(U.svg('line', {x1:130, x2:W-20, y1:Y(v), y2:Y(v), 'class':'gl'})); txt(svg, 124, Y(v)+4, v.toFixed(2), {'text-anchor':'end', 'class':'tick'}); }
  d.arms.forEach(function(a, i){ var xb = 170 + i*230;
    txt(svg, xb+60, H-6, a.name + ' · floor growth ' + a.g, {'text-anchor':'middle', 'font-weight':600});
    [['T = 500', a.v500, 0], ['T = 1000', a.v1000, 1]].forEach(function(s){ var x = xb + s[2]*120, g = U.svg('g');
      txt(svg, x, H-24, s[0], {'text-anchor':'middle', 'class':'tick'});
      var mean = s[1].reduce(function(p,c){return p+c;},0)/s[1].length;
      s[1].slice().sort(function(p,q){return p-q;}).forEach(function(v, k){ g.appendChild(U.svg('circle', {cx:x + ((k%2)?6:-6), cy:Y(v), r:3.6, fill: s[2] ? 'var(--ink)' : 'var(--surface)', stroke:'var(--ink)', 'stroke-width':1.3})); });
      g.appendChild(U.svg('line', {x1:x-18, x2:x+18, y1:Y(mean), y2:Y(mean), stroke:'var(--muted)', 'stroke-width':1.5}));
      hover(g, [[a.name + ', ' + s[0], ''], 'identical runs, same seed', 'grey tick: their mean']); svg.appendChild(g); });
  });
  return svg;
}
function beat(){
  var d = D.beat, W = 620, H = 210, svg = U.svg('svg', {viewBox:'0 0 '+W+' '+H, role:'img', 'aria-label':'seed dispersion over the rerun floor'});
  var x0 = 170, x1 = 560, X = function(v){ return x0 + v/6*(x1-x0); };
  [0,1,2,3,4,5,6].forEach(function(v){ svg.appendChild(U.svg('line', {x1:X(v), x2:X(v), y1:10, y2:H-34, 'class': v===1 ? 'zero' : 'gl'})); txt(svg, X(v), H-18, v + '×', {'text-anchor':'middle', 'class':'tick'}); });
  txt(svg, X(1)+4, 16, '1× = the floor', {'font-size':10.5, style:'fill:var(--muted)'});
  d.rows.concat([{name:'survival Γ / floor-basis sd(Γ)', v:d.gamma.v, t:d.gamma.t, g:1}]).forEach(function(r, i){ var y = 34 + i*30 + (r.g ? 10 : 0), g = U.svg('g');
    g.appendChild(U.svg('text', {x:6, y:y+4, 'font-size':11, style:'fill:var(--ink2)'}, r.name));
    g.appendChild(U.svg('rect', {x:x0, y:y-7, width:X(r.v)-x0, height:14, rx:3, fill: r.g ? 'var(--ink)' : 'var(--muted)'}));
    g.appendChild(U.svg('text', {x:X(r.v)+6, y:y+4, 'font-size':11.5, 'font-weight':600, 'class':'num'}, r.t));
    hover(g, [[r.name, r.t]]); svg.appendChild(g); });
  return svg;
}
function render(){
  Array.prototype.forEach.call(tabs.children, function(b, i){ var on = TABS[i].k===S.tab; b.setAttribute('aria-selected', on?'true':'false'); b.setAttribute('aria-pressed', on?'true':'false'); });
  var host = document.getElementById('panel'); U.clear(host); var d = D[S.tab];
  host.appendChild({card:card, artifact:artifact, length:length, beat:beat}[S.tab]());
  document.getElementById('sub').textContent = d.sub;
  var cf = document.getElementById('conf'); cf.textContent = d.confound ? 'confound: ' + d.confound : ''; cf.style.display = d.confound ? '' : 'none';
  U.tip.hide(); if(window.__fit) window.__fit();
}
document.addEventListener('keydown', function(e){ var i = TABS.findIndex(function(x){return x.k===S.tab;});
  if(e.key==='ArrowRight'){ S.tab = TABS[Math.min(3,i+1)].k; render(); } if(e.key==='ArrowLeft'){ S.tab = TABS[Math.max(0,i-1)].k; render(); } });
window.__redraw = render; render();
</script>
