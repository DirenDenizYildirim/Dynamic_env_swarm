[project]
name = "che"
version = "0.1.0"
description = "Compound Hostile Environment (CHE) swarm: pure-JAX MARL substrate + PBT/IPPO training"
# 3.12, not 3.11: jax 0.11.0 requires >= 3.12, and 0.11.0 is the toolchain
# M6.0 certified traced-theta bitwise on and every Phase-6 run has used.
# The old >=3.11 bound let a fresh box build a 3.11 venv, silently resolve
# jax 0.10.2, and run a different toolchain than the science was measured
# under (2026-08-02; docs/decision_log.md).
requires-python = ">=3.12"
dependencies = [
    "jax>=0.11.0",
    "flax>=0.10",
    "optax>=0.2.3",
    "distrax>=0.1.5",
    "chex>=0.1.87",
    "orbax-checkpoint>=0.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.35"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["che"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["che/tests"]
addopts = "-q"
markers = [
    "slow: theory-scale MC tests (M2.3+); run with -m slow, excluded via -m 'not slow'",
]
