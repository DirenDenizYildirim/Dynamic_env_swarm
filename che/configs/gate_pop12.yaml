# Re-anchored throughput gate configuration (human ruling 2026-07-28, M5.1
# STOP, ruling 1b). The guarded quantity is no longer an env-only figure
# divided by 81; it is DIRECTLY MEASURED population-aggregate training
# throughput, because training is what spends the budget.
#
# This is the Phase-6/7 spending configuration: the M0.6 operating point
# (64^2, 12 agents, 256 envs per member, rollout 128, population 12,
# K_pbt 20 — fallback-ladder rung 2, phase0_report.md) carrying every
# stressor Phase 6/7 will actually run.
#
# Measured with `pbt.py --bench`, the same instrument that produced the
# Phase-0 159.0 k steps/s row, so the number is comparable to it and to the
# 100 k contingency line without any projection in between.
#
# Locked parameter provenance:
#   beta 0.49        severity_lock.md (Medium, near-critical) 2026-07-19
#   kappa_A 0.06 + lambda_0/lambda_load/f_weak  coupling_a_lock.md 2026-07-21
#   kappa_B 1.0      kappa_b_lock.md 2026-07-27 (M4.4-revised)
#   death_penalty 0.5  D4, decision_log 2026-07-19
#   delta 0.0        comms live but undenied; r_comm is NOT locked until
#                    M5.4, so 8.0 is the plumbing default. Link draws are
#                    unconditional, so throughput is insensitive to both
#                    (che/env/comms.py) — the cost is the same at any delta.
env:
  grid_size: 64
  n_agents: 12
  horizon: 256
  obs_window: 9
  obs_version: 3
  n_food: 32

theta:
  beta: 0.49
  kappa_A: 0.06
  lambda_0: 5.0e-5
  lambda_load: 4.0e-4
  f_weak: 0.15
  kappa_B: 1.0
  delta: 0.0
  death_penalty: 0.5
  iota: 0.0
  sigma_s: 1.0
  eta: 0.5

train:
  n_envs: 256
  pop_size: 12
  rollout_len: 128
  n_minibatches: 4
  n_epochs: 4
  pbt_interval: 20
  ckpt_interval: 50
