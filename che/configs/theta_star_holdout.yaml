# theta* — THE HELD-OUT COMPOSITION POINT (Def. 8).
#
# ##########################################################################
# RESOLVED 2026-08-02. This config previously refused to load: `beta` was the
# sentinel PENDING_PHASE6_CALIBRATION and the tripwire held until the gate
# fixed the held-out severity. It did (PHASE-6 REMEDY RULINGS, ruling 1), and
# the value arrived MEASURED rather than invented — which is exactly what the
# tripwire was written to demand.
# ##########################################################################
#
# WHAT IT IS. Def. 8 (docs/theory_foundations.md §7) fixes
# theta* as "all elements active, at HELD-OUT severity levels", and defines
# the JOINT protocol as training on multi-element configurations "still
# excluding theta*'s held-out severities". The compositional gap
#
#     Gamma(theta*) = J_theta*(pi_joint) - J_theta*(pi_iso)
#
# is the paper's locked hypothesis, and it is only meaningful if theta* is a
# point NEITHER protocol trained on. Which severities those are is a design
# choice, and the gate made it: see below.
#
# HOW beta = 0.49 IS HELD OUT. Phase 6 trains on the EXTREMES
# {0.43 (Low), 0.70 (High)} and holds out the middle. So 0.49 is a severity
# NEITHER protocol trains on, which is what Def. 8 requires — and it is
# already calibrated, at 512 seeds in Phase 2 (P_span 0.547, burnt fraction
# 19.8 %, L = 64). No fresh calibration was needed and none was invented.
#
# WHY THE MIDDLE. The two elements have OPPOSITE severity gradients:
# Coupling A is "marginal by construction" at High (fuel-limited seeding,
# coupling_a_lock.md) while Coupling B's masking ceiling runs
# 0.028 / 0.130 / 0.419 across Low / Medium / High (kappa_b_lock.md). The
# earlier candidates 0.46 and 0.60 each had one element effectively inert,
# so Gamma ~ 0 would have been the expected result even under a TRUE
# hypothesis. Medium is the only severity where both couplings satisfy their
# own lock criteria. It also carries the smallest measured floors of the
# three cells (survival 0.0130 vs High 0.0621).
#
# DESIGN PROPERTY, stated rather than left for a reviewer: training spans
# sub- and super-critical only, so the NEAR-CRITICAL regime is the test
# point and no training data sits near criticality.
#
# Every OTHER value here is locked and written out explicitly, constructed
# from docs/locks.yaml (ruling 1b, 2026-07-31) — nothing inherited, nothing
# from argv.
env:
  grid_size: 64
  n_agents: 12
  horizon: 256
  obs_window: 9
  obs_version: 3
  n_food: 32

theta:
  # HELD-OUT severity (locks.yaml: beta_holdout). Numerically equal to
  # beta_medium, but a DIFFERENT locked constant playing a different role —
  # a future re-siting moves this one and not the training severity.
  beta: 0.49
  # ELEMENT: Coupling A — M3.4 HUMAN-LOCKED 2026-07-21 (coupling_a_lock.md).
  # kappa_A is severity-independent by ruling: per-severity values were
  # considered and REJECTED because they would break Phase-7 factorial
  # semantics. It therefore transfers to the held-out severity unchanged,
  # which is precisely why that ruling mattered.
  kappa_A: 0.06
  lambda_0: 5.0e-5
  lambda_load: 4.0e-4
  f_weak: 0.15
  # ELEMENT: Coupling B — M4.3 HUMAN-LOCKED 2026-07-27, revised to 1.0 by
  # the M4.4 amendments (kappa_b_lock.md).
  kappa_B: 1.0
  # ELEMENT: comms denial — M5.3 CLOSURE RULING 2026-07-30 (comms_lock.md).
  # ELEMENT-ON. Retained in theta* for REGISTRATION FIDELITY AT ZERO COST:
  # the element stays in the recorded design even though it is certified
  # inert, so the Phase-7 composition is effectively over {Coupling A,
  # Coupling B}. The dose-response x-axis (A x B co-active visitation) is
  # unaffected (D6 append).
  delta: 1.0
  r_comm: 16.0
  # D4 (decision_log 2026-07-19).
  death_penalty: 0.5
  iota: 0.0
  sigma_s: 1.0
  eta: 0.5

train:
  n_envs: 256
  rollout_len: 128
  n_minibatches: 4
  n_epochs: 4
  ckpt_interval: 50
