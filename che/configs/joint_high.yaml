# JOINT protocol — all elements ON at severity HIGH (supercritical race).
#
# WHAT THIS IS, in Def.-8 terms (docs/theory_foundations.md §7). The JOINT
# protocol trains "a single policy on a mixture whose support includes
# multi-element configurations (all elements co-active) at TRAINING
# severity levels (still excluding theta*'s held-out severities)". This
# file is one point of that support. It is deliberately NOT named
# theta_star_*: theta* is the HELD-OUT composition point and lives in
# theta_star_holdout.yaml. Blurring the two would undermine the very claim
# they serve — Gamma(theta*) = J(pi_joint) - J(pi_iso) means nothing unless
# theta* is a point neither protocol trained on. (Round-2 ruling
# 2026-07-31, docs/decision_log.md.)
#
# CONSTRUCTED FROM LOCKS, NOT DERIVED BY INHERITANCE (ruling 1b). Every
# locked value below is written out explicitly and asserted against
# docs/locks.yaml by che/tests/test_locks.py.
#
# The ONLY difference from severity_high.yaml is delta: 0.0 -> 1.0 (the
# comms element switched ON).
#
# POWER WARNING for Phase 6/7 design (HANDOFF.md, M5.3b/M5.5 floors). High
# is the WEAKER measurement cell, not the stronger one: its measured
# reproducibility floors are completion 0.0522 / survival 0.0621, against
# Medium's 0.0399 / 0.0130. High therefore resolves only ~11-point effects
# where Medium resolves ~3-point ones, and reaching Medium's bar at High
# would need ~46 seeds/arm. Do not site a decisive comparison here without
# a power analysis against these floors ("bars come with floors", CLAUDE.md).
env:
  grid_size: 64
  n_agents: 12
  horizon: 256
  obs_window: 9
  # M4.1 (2026-07-24): obs v3 — Coupling B masking + visibility plane.
  obs_version: 3
  n_food: 32

theta:
  # Severity — M2.4 HUMAN-LOCKED 2026-07-19 (severity_lock.md).
  # Supercritical: v_hat 0.83 cells/step (83 % of agent speed — outrunnable,
  # barely), P_span 0.998, burnt fraction 98.3 %; spec band v_hat in
  # [0.5, 1.0] SATISFIED. An evacuation-while-foraging regime by design.
  beta: 0.70
  # ELEMENT: Coupling A — M3.4 HUMAN-LOCKED 2026-07-21 (coupling_a_lock.md,
  # candidate 2). NOTE: the ignition channel is FUEL-LIMITED at High
  # (seeded/ep 0.78, below the [1, 5] band) — recorded at the lock as
  # fuel-exhaustion self-limitation, not as a miss to be tuned away.
  # Per-severity kappa_A was considered and REJECTED (Phase-7 factorial
  # semantics), so 0.06 stands here unchanged.
  kappa_A: 0.06
  lambda_0: 5.0e-5
  lambda_load: 4.0e-4
  f_weak: 0.15
  # ELEMENT: Coupling B — M4.3 HUMAN-LOCKED 2026-07-27, revised to 1.0 by
  # the M4.4 amendments (kappa_b_lock.md). Coupling B is NOT inert here:
  # -8.8 pt survival at High with completion intact (Phase-4 close).
  kappa_B: 1.0
  # ELEMENT: comms denial — M5.3 CLOSURE RULING 2026-07-30 (comms_lock.md).
  # delta = 1.0 is the ELEMENT-ON value. The out-degree evidence behind the
  # R_comm lock IS this severity (M5.3b Cell B, trained High policies).
  delta: 1.0
  r_comm: 16.0
  # D4 (decision_log 2026-07-19): dp = 0.5 for all training from Phase 3 on.
  death_penalty: 0.5
  iota: 0.0
  sigma_s: 1.0
  eta: 0.5

train:
  n_envs: 256
  rollout_len: 128
  n_minibatches: 4
  n_epochs: 4
  ckpt_interval: 50
