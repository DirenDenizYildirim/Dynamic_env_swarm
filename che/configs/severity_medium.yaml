# Severity MEDIUM — near-critical hazard (M2.4, HUMAN-LOCKED).
# Provenance: severity_lock.md (2026-07-19, owner + RA decision record);
#   beta_c_hat = 0.500 +/- 0.005 (R_L crossing family; self-duality
#   R(beta_c) ~ 1/2 at all L). Beta chosen: 0.49 — deliberately between the
#   finite-size pseudo-critical point beta_c(64) ~ 0.486 and beta_c_hat =
#   0.500: "near-critical" for a finite arena means correlation length ~ L,
#   and 0.49 also centers the P_span spec band. Maximal-fluctuation regime;
#   expect the highest across-seed variance in M2.5 (theory Def. 4).
# Measured at L=64, 512 seeds (calibration.npz sha256 c131ba72ecd6e27c...,
#   calibration_crossing.npz sha256 74acb17addec78be...):
#   P_span = 0.547, mean burnt fraction = 19.8%
#   -> spec band Medium: P_span in [0.3, 0.7]  SATISFIED.
# Training protocol otherwise identical to phase1_accept.yaml (M1.5
# operating point); M2.5 overrides death_penalty via --death-penalty.
env:
  grid_size: 64
  n_agents: 12
  horizon: 256
  obs_window: 9
  # M4.1 (2026-07-24): obs v3 — Coupling B masking + visibility plane.
  # Prior (v2) checkpoints are archival-only per the D5 protocol.
  obs_version: 3
  n_food: 32

theta:
  beta: 0.49
  # Coupling A + structure — M3.4 HUMAN-LOCKED 2026-07-21
  # (coupling_a_lock.md, joint w/ RA; calibration m34/
  # coupling_a_calibration.json, candidate 2). Random-policy targets met
  # at Low+Medium: collapses/ep 8.5, seeded/ep 4.47, deaths_collapse
  # 0.180, Low seeded-burnt share 0.763. r_seed=1 / weak_smooth=2 are the
  # config defaults, locked as-is.
  kappa_A: 0.06
  lambda_0: 5.0e-5
  lambda_load: 4.0e-4
  f_weak: 0.15
  # Coupling B — M4.3 HUMAN-LOCKED 2026-07-27 (kappa_b_lock.md;
  # calibration m43/coupling_b_calibration*.json). Locked on the
  # env-native detection band P(Burning cell at crop distance 3
  # revealed) = 0.438/0.427 under the two probe arms, inside the
  # [0.4, 0.7] band; the E2C cross-reference (q = 0.812 vs a 0.70
  # ceiling) is a demoted consistency check, and the masked_frac
  # band was retired as policy-suppressible. Considered and
  # recorded: 0.95 (band-robust, q = 0.826) and 1.1 (q = 0.768 but
  # detection only at the band floor). M4.4 overrides to 0.0 for
  # the ablation arm.
  kappa_B: 1.0
  # Comms — M5.3 CLOSURE RULING 2026-07-30 (comms_lock.md; recorded in
  # docs/locks.yaml, asserted by che/tests/test_locks.py).
  # delta 0.0 is ELEMENT-OFF and is correct for a base config: the locked
  # element-ON value delta = 1.0 belongs to joint_*.yaml and
  # theta_star_holdout.yaml (round-2 ruling 2026-07-31). R_comm is
  # stated explicitly rather than inherited (repo-explorer ruling 1a,
  # 2026-07-31) — it was previously reachable only via `--r-comm 16` on
  # the command line. Locked on the geometric observable alone: mean alive
  # out-degree 2.99-3.37 at R = 16 vs 0.93-1.06 at R = 8, band [2, 5].
  # This is the config M5.5 ran (provenance.txt: R_comm 16, out-deg 3.213).
  delta: 0.0
  r_comm: 16.0
  # D4 (decision_log 2026-07-19): dp = 0.5 for ALL training from Phase 3
  # onward. Written inline 2026-07-31 (repo-explorer round-2 ruling): it
  # was previously reachable only via `--death-penalty 0.5`, the same
  # defect class as r_comm. No past run changes — every Phase-3/4/5 script
  # passes the flag explicitly, so the override sets the value it always
  # set. What changes is that a bare `--config ...` run with no flag no
  # longer silently runs at 0.0, i.e. no longer silently violates D4.
  death_penalty: 0.5
  iota: 0.0
  sigma_s: 1.0
  eta: 0.5

train:
  n_envs: 256
  rollout_len: 128
  n_minibatches: 4
  n_epochs: 4
  ckpt_interval: 50
